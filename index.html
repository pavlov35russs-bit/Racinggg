<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ebanat Racing</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #a0f0e0; touch-action: none; font-family: sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        #progressBar { width: 60%; height: 20px; background: #333; margin: 10px auto; border-radius: 10px; overflow: hidden; border: 2px solid white; }
        #progressFill { width: 0%; height: 100%; background: #ffcc00; transition: width 0.1s; }
    </style>
</head>
<body>

<div id="ui">
    <div>LEVEL 13</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="distance">0</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const distanceText = document.getElementById('distance');

    // Подгоняем размер канваса под экран телефона
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Игровые переменные
    let speed = 0;
    const maxSpeed = 15;
    const acceleration = 0.5;
    const friction = 0.3;
    let isPressing = false;
    let distance = 0;
    const goalDistance = 1000;

    // Позиция машинки (по центру)
    const carX = canvas.width / 2;
    const carY = canvas.height * 0.7;

    // Обработка нажатий (Мышь + Тач)
    const startPress = () => {
        isPressing = true;
        if (window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    };
    const endPress = () => { isPressing = false; };

    window.addEventListener('mousedown', startPress);
    window.addEventListener('mouseup', endPress);
    window.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); }, {passive: false});
    window.addEventListener('touchend', endPress);

    // Главный игровой цикл
    function gameLoop() {
        // Логика скорости
        if (isPressing) {
            speed += acceleration;
            if (speed > maxSpeed) speed = maxSpeed;
        } else {
            speed -= friction;
            if (speed < 0) speed = 0;
        }

        // Логика дистанции
        distance += speed;
        if (distance > goalDistance) distance = goalDistance; // Финиш
        
        // Обновляем UI
        progressFill.style.width = (distance / goalDistance * 100) + '%';
        distanceText.innerText = Math.floor(distance / 10); // Просто красивая цифра

        // Очистка экрана
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем дорогу (просто серая полоса для примера)
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.2, canvas.height);
        ctx.lineTo(canvas.width * 0.8, canvas.height);
        ctx.lineTo(canvas.width * 0.6, carY - 100);
        ctx.lineTo(canvas.width * 0.4, carY - 100);
        ctx.fill();

        // Рисуем машинку (пока просто фиолетовый квадрат с зонтиком, потом вставишь картинки)
        ctx.save();
        ctx.translate(carX, carY);
        
        // Тряска при езде
        if (speed > 0) {
            ctx.translate(Math.random() * 2 - 1, Math.random() * 2 - 1);
        }

        // Корпус
        ctx.fillStyle = '#b39ddb'; // Фиолетовый как на скрине
        ctx.fillRect(-60, -30, 120, 40);
        
        // Зонтик
        ctx.fillStyle = '#4fc3f7';
        ctx.beginPath();
        ctx.arc(0, -30, 30, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(0, -30, 30, Math.PI, Math.PI + Math.PI/4);
        ctx.fill();

        // Колёса (крутятся)
        ctx.fillStyle = '#333';
        let wheelRotation = (Date.now() / 100 * speed) % (Math.PI * 2);
        
        // Левое колесо
        ctx.save();
        ctx.translate(-40, 10);
        ctx.rotate(wheelRotation);
        ctx.fillRect(-10, -10, 20, 20);
        ctx.restore();

        // Правое колесо
        ctx.save();
        ctx.translate(40, 10);
        ctx.rotate(wheelRotation);
        ctx.fillRect(-10, -10, 20, 20);
        ctx.restore();

        ctx.restore();

        requestAnimationFrame(gameLoop);
    }

    // Запуск
    gameLoop();

    // Ресайз при повороте экрана
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>
</body>
</html>
